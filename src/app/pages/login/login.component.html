<div class="login-container">
  <div class="login-card">
    <h2>Acceso Administrativo</h2>
    <p class="subtitle">Clínica Estética</p>
    
    <form (submit)="onLogin()">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" [(ngModel)]="correo" name="correo" placeholder="admin@estetica.com" required>
        </div>
      
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" required>
        </div>

        <div *ngIf="errorMessage" class="error-message">
            {{ errorMessage }}
        </div>

        <button type="submit" class="btn-login" [disabled]="segundosBloqueo > 0">
          {{ segundosBloqueo > 0 ? 'Espera ' + segundosBloqueo + ' s' : 'Ingresar al Panel' }}
        </button>
    </form>
  </div>
</div>
