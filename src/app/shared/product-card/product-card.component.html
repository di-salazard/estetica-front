<div class="card">
  <div class="image-container">
    
    <img [src]="imagen" alt="{{ servicio?.titulo }}">
    
    <div class="ribbon" *ngIf="servicio?.enOferta">
      <span>TRATAMIENTO<br>CON DESCUENTO</span>
    </div>
    
  </div>

  <div class="card-info">
    <h3>{{ servicio?.titulo }}</h3>
    
    <p class="label">Descripción</p>
    
    <p>{{ servicio?.descripcionBase }}</p>
  </div>
</div>
